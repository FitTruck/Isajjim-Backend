# application.yml
server:
  forward-headers-strategy: native

spring:
  application:
    name: isajjim
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            admin-key: ${KAKAO_ADMIN_KEY}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - account_email
            client-name: kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
            jwk-set-uri: https://kauth.kakao.com/.well-known/jwks.json
          google:
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

rest-client:
  connect-timeout: 5
  read-timeout: 30

infra:
  ai:
    base-url: ${AI_BASE_URL}
    use-server: ${AI_USE_SERVER}
  google:
    gemini:
      model: ${GEMINI_MODEL}
  firebase:
    key-path: file:configs/firebaseKey.json
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}
    region:
      static: ${AWS_REGION}
    s3:
      bucket: ${AWS_S3_BUCKET}

oauth2:
  allowed-redirect-uris:
    - http://localhost:8081
    - https://localhost:8081
    - https://isajjim.kro.kr
    - isajjim://oauth2/callback
  client:
    provider:
      google:
        jwks-uri: https://www.googleapis.com
        secret: ${GOOGLE_CLIENT_ID}
        client-secret: ${GOOGLE_CLIENT_SECRET}
        issuer: https://accounts.google.com
      kakao:
        jwks-uri: https://kauth.kakao.com
        secret: ${KAKAO_SECRET}
        issuer: https://kauth.kakao.com

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
  refresh-token:
    expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
    reissue-limit-days: ${JWT_REFRESH_TOKEN_REISSUE_LIMIT_DAYS}

app:
  security:
    encryption-key: ${APP_ENCRYPTION_KEY}

auth:
  internal-token: ${AUTH_TOKEN}