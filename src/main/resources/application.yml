# application.yml
spring:
  application:
    name: isajjim
  profiles:
    active: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

rest-client:
  connect-timeout: 5
  read-timeout: 30

infra:
  ai:
    base-url: ${AI_BASE_URL}
    use-server: ${AI_USE_SERVER}
  google:
    project-id: ${GOOGLE_PROJECT_ID}
    gcs:
      key-path: file:configs/gcsKey.json
      bucket: ${GOOGLE_GCS_BUCKET}
    gemini:
      model: ${GEMINI_MODEL}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME}
  refresh-token:
    expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME}
    reissue-limit-days: ${JWT_REFRESH_TOKEN_REISSUE_LIMIT_DAYS}