# application-dev.yml
spring:
  datasource:
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}

swagger:
  server-url: ${DEV_SWAGGER_URL}

oauth2:
  allowed-redirect-uris:
    - ${FRONTEND_URL}
    - ${DEV_BASE_URL}
    - isajjim://oauth2/callback